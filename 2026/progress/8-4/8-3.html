<!DOCTYPE html>
<html lang="en">
	<head>
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
		<title>7-2: Event Listener and JS Styling</title>
		<style>
			* {
				margin: 0;
				padding: 0;
			}

			html {
				height: 100%;
				width: 100%;
			}

			body {
				min-height: 100%;
				width: 100%;
				overflow-x: hidden;
				background-color: pink;
			}

			body > article {
				text-align: center;
			}

			body > article > section {
				display: inline-block;
				width: 500px;
				height: 500px;
				background-color: lightgrey;
			}

			h1, button {
				font-family: sans-serif;
			}

			button {
				padding: 5px;
				font-size: 200%;
			}

			button:hover {
				background-color: goldenrod;
				cursor: pointer;
			}
		</style>
	</head>
	<body>
		<article>
			<h1>Change the Color of the Square!</h1>
			<section>
				
			</section>
			<p>
				<button id="green">Green!</button> <button id="yellow">Yellow!</button>
			</p>
		</article>
	</body>
</html>
