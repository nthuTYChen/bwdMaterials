<!DOCTYPE html>
<html lang="en">
	<head>
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
		<title>13-1: Introducing Transition</title>
		<style>
			body {
  				background-color: white;
			}

			article {
				background-color: pink;
  				text-align: center;
  				line-height: 100vh;
			}

			section {
  				display: inline-block;
  				width: 300px;
  				height: 300px;
  				margin: 10px;
  				font-size: 3vh;
  				font-family: sans-serif;
  				line-height: 300px;
  				text-align: center;
  				background-color: red;
  				color: darkgrey;
			}

			section:nth-of-type(even) {
				background-color: gold;
			}

			a, a:visited {
				color: hotpink;
				text-decoration: none;
				/* 
      				 transition controls how smoothly a CSS property changes.

       				all:
       				All animatable CSS properties will transition smoothly.

       				0.3s:
       				The transition lasts 0.3 seconds.

       				linear:
       				The change happens at a constant speed from beginning to end.

       				In this code, this transition mainly affects the color change
       				when the mouse leaves the link and the link returns from
       				yellow back to hotpink.
    			*/
				transition: all 0.3s linear;
			}

			a:hover {
				color: yellow;
				/* 
       				This transition is active during the hover state.

       				all:
       				All animatable CSS properties will transition smoothly.

       				0.5s:
       				The transition lasts 0.5 seconds.

       				ease-out:
       				The transition starts faster and slows down near the end.

       				In this code, this transition mainly affects the color change
       				when the mouse enters the link and the link changes from
       				hotpink to yellow.
    			*/
				transition: all 0.5s ease-out;
			}
		</style>
	</head>
	<body>
		<article>
			<section>
				<a href="https://google.com" target="_blank">Google</a>
			</section>
			<section>
				<a href="https://www.yahoo.com" target="_blank">Yahoo</a>
			</section>
			<section>
				<a href="https://www.amazon.com" target="_blank">Amazon</a>
			</section>
		</article>
	</body>
</html>
