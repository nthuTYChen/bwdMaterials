<!DOCTYPE HTML> 
<html lang="en"> 
	<head> 
		<title>4-2: Introducing JavaScript</title> 
		<meta charset="UTF-8">
		<script>
			/* 
				This is a multi-line annotation.
			 */
			/* This is a statement.
			   A statement is a complete instruction in JavaScript.
			   It tells the program to do something.
			   Here, the instruction is: show an alert box with the message "Don't be scared!"
			   alert("Don't be scared!");
			   Outputs the text "A message is logged!" to the browser console. 
			   Each statement should end with a semicolon. */
			console.log("A message is logged!");

			// Declares a variable named x and assigns it the value 5.
			var x = 5;

			// Outputs the value stored in x to the browser console.
			console.log(x);
		</script>
	</head>
	<body>
		Nothing interesting in this section.
	</body>
</html>
