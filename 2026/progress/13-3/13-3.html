<!DOCTYPE>
<html lang="en-us">
	<head>
		<meta charset="utf-8">
		<title>13-3: Introducing Keyframes</title>
		<style>
			@import url('https://fonts.googleapis.com/css2?family=Concert+One&display=swap');

			* {
				padding: 0;
				margin: 0;
			}

			html {
				width: 100%;
				height: 100%;
			}

			body {
				width: 100%;
				height: 100%;
				min-height: 100%;
				font-family: Concert One, sans-serif;
			}

			body > article {
				color: darkorange;
				position: absolute;
				top: 50vh;
				left: 50vw;
				transform: translate(-50%, -50%);
			}

			/*
       			Targets the first <span> element inside an <h1> element.

       			h1 > span means:
       			Select <span> elements that are direct children of an <h1>.

       			:first-of-type means:
       			Select the first <span> among the span elements inside the same parent.
    		*/
			h1 > span:first-of-type {
				 /*
       				Applies an animation to the selected <span> element.

       				changeOpacity:
       				This is the name of the animation.

       				1s:
       				The animation takes 1 second to complete one cycle.

       				ease-in:
       				The animation starts slowly and then becomes faster.

       				infinite:
       				The animation repeats forever.

       				alternate:
       				The animation direction alternates each cycle.

       				This means:
       				- In the first cycle, the span changes from opacity 1 to opacity 0.1.
       				- In the next cycle, it changes back from opacity 0.1 to opacity 1.
       				- This back-and-forth animation continues forever.

       				As a result, the first <span> inside the <h1> appears to fade in
       				and fade out repeatedly.
       			*/
				animation: changeOpacity 1s ease-in infinite alternate;
			}

			/* Add the animation to other <span> in <h1> below but with a different time length */
			h1 > span:nth-of-type(2) {
				animation: changeOpacity 0.3s ease-in infinite alternate;
			}

			h1 > span:nth-of-type(3) {
				animation: changeOpacity 0.44s ease-in infinite alternate;
			}

			h1 > span:nth-of-type(4) {
				animation: changeOpacity 1.3s ease-in infinite alternate;
			}

			h1 > span:nth-of-type(5) {
				animation: changeOpacity 0.72s ease-in infinite alternate;
			}

			h1 > span:nth-of-type(6) {
				animation: changeOpacity 0.15s ease-in infinite alternate;
			}

			@keyframes changeOpacity {
				 /* 
       				Defines an animation named changeOpacity.

       				@keyframes is used to describe how an element should change
       				during an animation.

       				The name changeOpacity can later be used with the animation-name
       				property or inside the animation shorthand property.
    			*/
				from {
					/* 
           				Defines the starting point of the animation.

           				It describes how the element looks at the beginning.

           				The element starts fully visible.
        			*/
					opacity: 1;
				}
				to {
					/* 
          				Defines the ending point of the animation.

           				It describes how the element looks at the end.

           				The element becomes almost transparent.

           				opacity: 0.1 means the element is still slightly visible,
           				but much less visible than before.
        			*/
					opacity: 0.1;
				}
			}
		</style>
	</head>
	<body>
		<article>
			<h1>
				<!-- Enclose every word inside <span></span>, so each word can have different animation settings
				     as shown above. Consequently, different parts of the sentence "shine" in a different way.
				-->
				<span>This</span> <span>is</span> <span>going</span> <span>to</span> <span>be</span> <span>cool!</span>
			</h1>
		</article>
	</body>
</html>
