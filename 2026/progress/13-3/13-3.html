<!DOCTYPE>
<html lang="en-us">
	<head>
		<meta charset="utf-8">
		<title>13-3: Introducing Keyframes</title>
		<style>
			@import url('https://fonts.googleapis.com/css2?family=Concert+One&display=swap');

			* {
				padding: 0;
				margin: 0;
			}

			html {
				width: 100%;
				height: 100%;
			}

			body {
				width: 100%;
				height: 100%;
				min-height: 100%;
				font-family: Concert One, sans-serif;
			}

			body > article {
				color: darkorange;
				position: absolute;
				top: 50vh;
				left: 50vw;
				transform: translate(-50%, -50%);
			}

			h1 > span:first-of-type {
				animation: changeOpacity 1s ease-in infinite alternate;
			}

			h1 > span:nth-of-type(2) {
				animation: changeOpacity 0.3s ease-in infinite alternate;
			}

			h1 > span:nth-of-type(3) {
				animation: changeOpacity 0.44s ease-in infinite alternate;
			}

			h1 > span:nth-of-type(4) {
				animation: changeOpacity 1.3s ease-in infinite alternate;
			}

			h1 > span:nth-of-type(5) {
				animation: changeOpacity 0.72s ease-in infinite alternate;
			}

			h1 > span:nth-of-type(6) {
				animation: changeOpacity 0.15s ease-in infinite alternate;
			}

			@keyframes changeOpacity {
				from {
					opacity: 1;
				}
				to {
					opacity: 0.1;
				}
			}
		</style>
	</head>
	<body>
		<article>
			<h1>
				<span>This</span> <span>is</span> <span>going</span> <span>to</span> <span>be</span> <span>cool!</span>
			</h1>
		</article>
	</body>
</html>
