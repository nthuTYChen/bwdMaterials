<!DOCTYPE HTML> 
<html lang="en"> 
	<head> 
		<title>5-2: Operations in JavaScript</title> 
		<meta charset="UTF-8">
		<script>
			var x = 5, y = 10, z = 20;
			var res_add = x + y;
			console.log(res_add);
			var res_sub = z - x;
			var res_multi = y * z;
			var res_div = x / y;
			console.log(res_sub);
			console.log(res_multi);
			console.log(res_div);
			var name1 = "Tom", name2 = "Mary";
			var all_names = name1 + " " + name2;
			console.log(all_names);
			var simple_name = name2 - "y"; // Is the output "Mar"?
			console.log(simple_name);
			var x_str = "5";
			var res_add2 = x + x;
			console.log(res_add2);
			var res_add3 = x + x_str;
			console.log(res_add3);
		</script>
	</head>
	<body>
		Nothing interesting in this section.
	</body>
</html>
